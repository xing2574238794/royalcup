<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>皇家杯 · 决赛模拟器</title>
<meta name="theme-color" content="#c8102e">
<meta name="description" content="犬猫营养学决赛全真模拟：半决赛、总决赛、题库练习与错题本。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="皇家杯">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --red:#c8102e; --red-d:#a00d25; --ink:#1b1b1f; --sub:#6b6b76; --line:#e6e6ec;
  --bg:#f6f6f9; --card:#fff; --ok:#0a8f4d; --bad:#d21f3c; --warn:#c58a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:contain;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55}
#app{max-width:880px;margin:0 auto;padding:18px 16px 90px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0 0 10px;line-height:1.3}
h1{font-size:24px;overflow-wrap:anywhere}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0 0 10px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;
  box-shadow:0 1px 2px rgba(20,20,40,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
  background:var(--red);color:#fff;font-size:16px;font-weight:600;padding:13px 20px;border-radius:12px;
  transition:.15s transform,.15s opacity;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.grey{background:#ececf2;color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:22px 0 0 var(--red)}
.brand b{font-size:13px;letter-spacing:.12em;color:var(--red)}
.hr{height:1px;background:var(--line);margin:14px 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:12px;margin:0 0 9px;cursor:pointer;background:#fff;transition:.12s;font-size:15px}
.opt:hover{border-color:#cfcfda}
.opt.sel{border-color:var(--red);background:#fdf3f4}
.opt.correct{border-color:var(--ok);background:#eefaf3}
.opt.wrong{border-color:var(--bad);background:#fdeef1}
.opt .k{flex:0 0 24px;height:24px;border-radius:8px;background:#f0f0f5;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;color:var(--sub)}
.opt.sel .k{background:var(--red);color:#fff}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong .k{background:var(--bad);color:#fff}
.bar{height:6px;border-radius:6px;background:#ececf2;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--red);transition:width .1s linear}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
.timer.hot{color:var(--bad)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
  background:#f0f0f5;color:var(--sub)}
.badge.red{background:#fdeef1;color:var(--red)}
.badge.ok{background:#eefaf3;color:var(--ok)}
.stepbar{display:flex;gap:6px;margin:0 0 12px}
.stepbar i{flex:1;height:5px;border-radius:4px;background:#e6e6ec}
.stepbar i.on{background:var(--red)}
.stepbar i.ok{background:var(--ok)}
.stepbar i.bad{background:var(--bad)}
textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:12px;
  font-family:inherit;font-size:15px;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--red)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:11px;margin:0 0 8px;cursor:pointer;background:#fff;font-size:14.5px}
.chk.on{border-color:var(--ok);background:#f4fbf7}
.chk .n{flex:0 0 22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:12px;color:#9a9aa6}
.chk.on .n{background:var(--ok);border-color:var(--ok);color:#fff}
.chk .p{margin-left:auto;color:var(--sub);font-size:12.5px;white-space:nowrap;padding-left:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.kpigrid{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;min-width:0}
.kpi b{white-space:nowrap}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.homebtn{display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:15px 16px;cursor:pointer;transition:.15s;font-family:inherit;color:var(--ink)}
.homebtn:hover{border-color:var(--red);box-shadow:0 3px 14px rgba(200,16,46,.08)}
.homebtn b{font-size:16px}
.homebtn span{font-size:13px;color:var(--sub)}
.homebtn .ico{font-size:20px}
.reveal{background:#fbfbfd;border:1px dashed #dcdce6;border-radius:12px;padding:13px 14px;font-size:14.5px}
.tip{background:#fff8e6;border:1px solid #f2e0b0;border-radius:12px;padding:12px 14px;font-size:14px}
.note{font-size:13px;color:var(--sub)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
.medal{font-size:40px;line-height:1}
.rc-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b1b1f;color:#fff;
  padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.rc-toast.show{opacity:1;transform:translate(-50%,0)}
.center{text-align:center}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;max-width:880px;margin:0 auto}
/* --- 移动端优化 --- */
html{-webkit-text-size-adjust:100%}
.btn,.opt,.chk,.homebtn{touch-action:manipulation}
.opt,.chk,.homebtn{-webkit-user-select:none;user-select:none}
textarea,select,input{font-size:16px}
@media(max-width:560px){
  #app{padding:12px 12px 80px}
  h1{font-size:21px}
  h2{font-size:17px}
  .opt{padding:13px 12px;font-size:16px}
  .chk{padding:12px 12px;font-size:15px}
  .btn{padding:14px 18px}
  .kpi b{font-size:19px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ 我出的决赛级题目 ============ */
const DB = {
objective: [
{t:'single',top:'能量代谢',q:'由消化能（DE）推算代谢能（ME）时，需要从 DE 中扣除的是：',o:[['A','粪能'],['B','尿能与可燃气能'],['C','日粮中的水分'],['D','粗纤维'],],a:'B',ex:'GE−粪能=DE；DE−尿能−可燃气能=ME。'},
{t:'single',top:'能量代谢',q:'改良 Atwater 系数中，脂肪的代谢能系数是：',o:[['A','3.5 kcal/g'],['B','4 kcal/g'],['C','8.5 kcal/g'],['D','9 kcal/g']],a:'C',ex:'宠物食品常用改良 Atwater：蛋白 3.5、脂肪 8.5、NFE 3.5 kcal/g。'},
{t:'single',top:'标签与换算',q:'某猫粮水分 10%，粗蛋白 30%（饲喂状态），其干物质基础粗蛋白约为：',o:[['A','27%'],['B','30%'],['C','33.3%'],['D','36%']],a:'C',ex:'30 ÷ (100−10) × 100 = 33.3%。'},
{t:'single',top:'猫的独特性',q:'猫缺乏日粮供给时，最早可能表现为视网膜变性和扩张型心肌病的氨基酸是：',o:[['A','精氨酸'],['B','牛磺酸'],['C','蛋氨酸'],['D','赖氨酸']],a:'B',ex:'牛磺酸是猫的必需氨基酸，缺乏→视网膜退化（中央视网膜变性）、DCM。'},
{t:'single',top:'猫的独特性',q:'猫缺乏精氨酸时最典型的表现是：',o:[['A','白内障'],['B','高氨血症、呕吐甚至死亡'],['C','皮炎'],['D','贫血']],a:'B',ex:'精氨酸是尿素循环关键，缺乏→氨无法代谢→高氨血症。'},
{t:'single',top:'脂肪',q:'猫不能由亚油酸合成、必须由日粮直接提供的必需脂肪酸是：',o:[['A','亚油酸'],['B','α-亚麻酸'],['C','花生四烯酸'],['D','油酸']],a:'C',ex:'猫 Δ6 去饱和酶活性低，不能由亚油酸合成足量花生四烯酸。'},
{t:'single',top:'维生素',q:'猫不能利用 β-胡萝卜素合成视黄醇，主要因为缺乏：',o:[['A','视黄醇结合蛋白'],['B','β-胡萝卜素-15,15′-双加氧酶'],['C','脂肪酶'],['D','胆盐']],a:'B',ex:'猫肠道缺乏该双加氧酶，必须摄入预成型维生素 A。'},
{t:'single',top:'碳水化合物与纤维',q:'关于膳食纤维，正确的是：',o:[['A','属于可消化碳水化合物'],['B','是犬猫的必需营养素'],['C','部分可发酵并产生短链脂肪酸'],['D','全部为日粮提供能量']],a:'C',ex:'纤维不是必需营养素，但可发酵纤维产 SCFA，有益肠道与血糖。'},
{t:'single',top:'能量代谢',q:'RER = 70×BW^0.75 中的 0.75 次方，表示：',o:[['A','体表面积比例'],['B','代谢体重'],['C','活动系数'],['D','消化率']],a:'B',ex:'代谢体重（kg^0.75）与产热/散热相关，比体重线性更准确。'},
{t:'single',top:'生命周期',q:'生长期大型犬幼犬最需要严格控制的是：',o:[['A','粗蛋白'],['B','能量与钙'],['C','粗纤维'],['D','水分']],a:'B',ex:'能量过多→生长过快→DOD；钙过量或不足都会影响骨发育。'},
{t:'single',top:'生命周期',q:'母犬妊娠期能量需要明显增加，通常开始于：',o:[['A','交配后立即'],['B','妊娠第 5–6 周'],['C','分娩前 3 天'],['D','整个孕期均为 1.5 倍']],a:'B',ex:'前 4–5 周能量近正常，后期才逐步上调。'},
{t:'single',top:'生命周期',q:'哺乳期母犬能量需要最高可达维持需要的：',o:[['A','1.2 倍'],['B','1.5 倍'],['C','2–4 倍'],['D','10 倍']],a:'C',ex:'取决于窝仔数，可达维持的 2–4 倍。'},
{t:'single',top:'水与泌尿',q:'猫饮水欲望低、尿液浓缩能力强，最直接增加的风险是：',o:[['A','肥胖'],['B','下泌尿道疾病'],['C','糖尿病'],['D','皮肤病']],a:'B',ex:'尿量少、尿液浓缩→结晶/结石风险升高（FLUTD）。'},
{t:'single',top:'水与泌尿',q:'鸟粪石（磷酸铵镁）结石形成的典型尿液条件是：',o:[['A','酸性尿'],['B','碱性尿'],['C','中性尿'],['D','与 pH 无关']],a:'B',ex:'碱性尿 + 镁/磷/铵 → 鸟粪石；常与感染相关。'},
{t:'single',top:'水与泌尿',q:'草酸钙结石的饮食管理要点是：',o:[['A','长期酸化尿液'],['B','增加饮水、避免过度酸化'],['C','提高镁摄入'],['D','提高蛋白到 50%']],a:'B',ex:'酸化会促进草酸钙形成；重点是增加尿量、避免高草酸/高钙。'},
{t:'single',top:'疾病营养',q:'慢性肾病猫营养管理的核心是：',o:[['A','高蛋白'],['B','限磷'],['C','高钠'],['D','高钙']],a:'B',ex:'限磷延缓肾衰进展；蛋白适度限制而非越低越好。'},
{t:'single',top:'疾病营养',q:'猫脂肪肝（肝脂质沉积症）的营养管理关键是：',o:[['A','禁食减重'],['B','高蛋白、避免长时间禁食'],['C','极低蛋白'],['D','高脂']],a:'B',ex:'猫禁食 2–3 天即可诱发；需高蛋白、逐步恢复能量。'},
{t:'single',top:'疾病营养',q:'糖尿病猫日粮的典型特点是：',o:[['A','高碳水、低蛋白'],['B','高蛋白、低碳水'],['C','高脂肪'],['D','无特殊要求']],a:'B',ex:'高蛋白低碳水有助于血糖控制与减重。'},
{t:'single',top:'疾病营养',q:'食物不良反应的排除性试验通常需要持续：',o:[['A','3–5 天'],['B','2 周'],['C','8–12 周'],['D','6 个月']],a:'C',ex:'8–12 周严格单一饮食，再挑战。'},
{t:'single',top:'食品法规',q:'AAFCO“complete and balanced”的三种证明方式不包括：',o:[['A','饲喂试验'],['B','实验室分析/配方计算'],['C','同族产品'],['D','兽医推荐']],a:'D',ex:'只有前三种是 AAFCO 认可的方法。'},
{t:'single',top:'添加剂',q:'下列不属于宠物食品常用抗氧化剂的是：',o:[['A','维生素 E'],['B','BHA'],['C','乙氧基喹啉'],['D','氯化钠']],a:'D',ex:'氯化钠是调味/电解质，不是抗氧化剂。'},
{t:'single',top:'添加剂',q:'关于益生元、益生菌、后生元，正确的是：',o:[['A','后生元是活菌'],['B','益生元是能被有益菌利用的非消化成分'],['C','合生元＝益生菌＋抗生素'],['D','益生菌是灭活菌体']],a:'B',ex:'后生元=菌体成分/代谢产物；合生元=益生菌+益生元。'},
{t:'single',top:'肥胖',q:'犬猫绝育后维持能量需要通常下降：',o:[['A','5% 以内'],['B','10%–30%'],['C','40%–50%'],['D','不下降']],a:'B',ex:'激素变化+活动减少，需下调 10%–30% 并按 BCS 复评。'},
{t:'single',top:'老年',q:'老年犬营养管理重点不包括：',o:[['A','优质易消化蛋白'],['B','能量适当下调'],['C','增加磷摄入'],['D','关节与抗氧化支持']],a:'C',ex:'老年（尤其肾病）应限制磷，不是增加。'},
{t:'judge',top:'猫的独特性',q:'猫是专性肉食动物，因此日粮中必须完全不含碳水化合物。',o:[['T','正确'],['F','错误']],a:'F',ex:'猫可利用淀粉，碳水非必需但不必“零碳水”。'},
{t:'judge',top:'氨基酸',q:'犬与猫的必需氨基酸种类完全相同。',o:[['T','正确'],['F','错误']],a:'F',ex:'猫多一种：牛磺酸。'},
{t:'judge',top:'维生素',q:'犬猫都需要从日粮中获得维生素 D，因为皮肤合成能力有限。',o:[['T','正确'],['F','错误']],a:'T',ex:'犬猫皮肤将 7-脱氢胆固醇转化为 D3 的能力有限。'},
{t:'judge',top:'氨基酸',q:'只要蛋白质摄入充足，猫就能自行合成足够的牛磺酸。',o:[['T','正确'],['F','错误']],a:'F',ex:'猫合成牛磺酸能力有限，必须日粮提供。'},
{t:'judge',top:'基础',q:'水不属于营养素，只是溶剂。',o:[['T','正确'],['F','错误']],a:'F',ex:'水是六大营养素之一。'},
{t:'judge',top:'水与泌尿',q:'犬猫对水的需要量约为 1 mL/kcal 代谢能。',o:[['T','正确'],['F','错误']],a:'T',ex:'约 50–60 mL/kg/日。'},
{t:'judge',top:'生命周期',q:'幼犬断奶后应自由采食到饱，以促进生长。',o:[['T','正确'],['F','错误']],a:'F',ex:'易过度生长，应定量分餐并监测 BCS。'},
{t:'judge',top:'骨骼',q:'大型犬幼犬生长过快会增加发育性骨科疾病的风险。',o:[['T','正确'],['F','错误']],a:'T',ex:'能量过多→生长过快→DOD/髋关节问题。'},
{t:'judge',top:'迷思',q:'无谷粮一定不含碳水化合物。',o:[['T','正确'],['F','错误']],a:'F',ex:'无谷只是不用谷物，可用豆类/马铃薯提供碳水。'},
{t:'judge',top:'蛋白质',q:'高蛋白日粮会直接导致健康犬猫的肾脏损伤。',o:[['T','正确'],['F','错误']],a:'F',ex:'无证据；肾病才需适度限制蛋白。'},
{t:'judge',top:'水与泌尿',q:'猫尿液浓缩能力强，所以少喝水也没关系。',o:[['T','正确'],['F','错误']],a:'F',ex:'少饮水是 FLUTD/CKD 的重要风险因素。'},
{t:'judge',top:'食品法规',q:'处方粮应在兽医指导下使用。',o:[['T','正确'],['F','错误']],a:'T',ex:'处方粮属特殊营养用途，需诊断与监测。'},
{t:'judge',top:'迷思',q:'生骨肉日粮营养全面，不需要额外补充。',o:[['T','正确'],['F','错误']],a:'F',ex:'常缺钙（骨肉比不当）、微量元素，且存在病原风险。'},
{t:'judge',top:'消化',q:'猫对碳水化合物的消化能力弱于犬，但仍可利用淀粉。',o:[['T','正确'],['F','错误']],a:'T',ex:'有胰淀粉酶与葡萄糖转运体，但适应性低于犬。'},
{t:'judge',top:'骨骼',q:'生长期犬的适宜钙磷比为 1:1–2:1。',o:[['T','正确'],['F','错误']],a:'T',ex:'比例失调会影响骨矿化。'},
{t:'judge',top:'肥胖',q:'肥胖是犬猫最常见的营养性疾病之一。',o:[['T','正确'],['F','错误']],a:'T',ex:'伴关节病、糖尿病、麻醉风险等。'},
{t:'judge',top:'皮肤',q:'食物过敏与食物不耐受的免疫机制相同。',o:[['T','正确'],['F','错误']],a:'F',ex:'过敏为免疫介导，不耐受为非免疫性。'},

short: [
{q:'为什么说猫是“专性肉食动物”？请从蛋白质、牛磺酸、精氨酸、维生素 A 四个方面说明其营养学后果。',
 pts:[{t:'蛋白质：猫对蛋白需要量高，缺乏时不能像犬那样下调分解、会快速出现负氮平衡',s:3},
      {t:'牛磺酸：猫合成能力有限，缺乏→中央视网膜变性、扩张型心肌病',s:3},
      {t:'精氨酸：缺乏→尿素循环受阻→高氨血症、呕吐甚至死亡',s:2},
      {t:'维生素 A：缺乏转化 β-胡萝卜素的双加氧酶，必须摄入预成型维 A',s:2}],
 model:'猫的蛋白质需要量高于犬，且对蛋白缺乏耐受差；牛磺酸为必需氨基酸，缺乏可致视网膜变性与心肌病；精氨酸参与尿素循环，缺乏引起高氨血症；猫缺乏 β-胡萝卜素-15,15′-双加氧酶，必须由日粮提供预成型维生素 A。'},
{q:'为什么大型犬幼犬生长期必须控制能量摄入与生长速度？不遵循会导致什么问题？',
 pts:[{t:'能量过多→生长过快→骨骼与软组织发育不同步',s:3},
      {t:'后果：发育性骨科疾病（DOD），如髋关节发育不良、骨软骨病、肥大性骨营养不良',s:3},
      {t:'钙磷：钙过量或不足都影响骨矿化，比例应在 1:1–2:1',s:2},
      {t:'措施：定量分餐、监测体重曲线与 BCS、避免自由采食与额外补钙',s:2}],
 model:'大型犬幼犬能量过量会加速生长，骨骼与软组织发育不匹配，显著增加 DOD（髋关节发育不良、骨软骨病等）风险；同时钙磷比例与钙量必须适宜，不能额外补钙；应定量饲喂、监测体重与 BCS。'},
{q:'为什么慢性肾病猫的饮食管理以“限磷”为核心？蛋白是否越低越好？',
 pts:[{t:'磷潴留→继发性甲状旁腺功能亢进→肾性骨病与肾损伤进展',s:3},
      {t:'限磷可延缓 CKD 进展、改善生活质量',s:2},
      {t:'蛋白需“适度限制”而非越低越好，过低会导致肌肉流失与负氮平衡',s:3},
      {t:'同时关注钾（常流失）、ω-3、血压与蛋白尿',s:2}],
 model:'磷潴留引起继发性甲旁亢，促进肾损伤与骨病，限磷是延缓进展的核心；但蛋白不是越低越好，过度限制会造成肌肉流失，应按 IRIS 分期适度限制并保证优质蛋白；同时补钾、关注血压与蛋白尿。'},
{q:'一只猫因排尿困难就诊，尿液 pH 7.2、镜检见鸟粪石结晶。请说明最可能的结石类型、三条饮食调整，并解释为什么不能“对所有结石都酸化尿液”。',
 pts:[{t:'类型：鸟粪石（磷酸铵镁），依据碱性尿+结晶+膀胱结石',s:3},
      {t:'措施：增加饮水（湿粮/流动水）、控制镁磷、酸化至目标 pH、控制体重、排查并治疗感染',s:4},
      {t:'反向风险：草酸钙结石需避免过度酸化，酸化会促进草酸钙形成',s:3}],
 model:'碱性尿+鸟粪石结晶提示磷酸铵镁结石；处理包括增加饮水、限制镁磷、在监测下酸化尿液、控制体重并排查尿路感染；但草酸钙结石策略相反，必须先确定结石类型，不能盲目酸化。'},
{q:'犬猫绝育后为什么容易发胖？饲喂上应如何调整？',
 pts:[{t:'机制：性激素下降→基础代谢率与活动量下降，能量需要降低约 10%–30%',s:3},
      {t:'行为：食欲可能上升、瘦体重略降',s:2},
      {t:'调整：按绝育后系数重算能量、定量分餐、定期 BCS 复评',s:3},
      {t:'可选：低能量密度高蛋白日粮、增加活动与环境丰容',s:2}],
 model:'绝育后激素变化使代谢与活动下降、食欲相对上升，能量需要降低 10%–30%；应按绝育系数重算、定量分餐、定期评估 BCS，并增加活动量。'},
{q:'一位主人说：“我买的是无谷粮，无谷肯定比含谷的健康。”请面向主人作答：先肯定出发点，再用两个理由纠正，最后给一句可执行建议。',
 pts:[{t:'共情/肯定：关注配料与健康是好习惯',s:2},
      {t:'理由一：无谷≠低碳水，也用豆类/马铃薯提供碳水',s:3},
      {t:'理由二：谷物并非过敏主因，“无谷更健康”缺乏证据；关键是全价、适口、适合个体',s:3},
      {t:'建议：看 AAFCO 全价声明与营养指标，按体重与 BCS 定量，换粮 7 天过渡',s:2}],
 model:'理解您关注配料的出发点。但无谷只是不含谷物，仍可用豆类、马铃薯提供碳水，并不等于低碳水；谷物也不是犬猫过敏的主要来源，“无谷更健康”目前缺乏证据。建议看包装是否标注 AAFCO 全价、按体重和体况定量饲喂，换粮用 7 天过渡。'},
{q:'为什么猫在禁食 2–3 天后容易发生肝脂质沉积症？营养管理要点是什么？',
 pts:[{t:'机制：猫蛋白质代谢与糖异生负荷大，饥饿时脂肪动员→肝脏甘油三酯堆积',s:3},
      {t:'诱因：肥胖猫、应激、疾病、突然换粮、厌食',s:2},
      {t:'管理：尽早恢复进食、高蛋白（约 35%–45% DM）、避免高脂骤增',s:3},
      {t:'支持：牛磺酸、精氨酸、钾、B 族维生素；必要时管饲、逐步加量防再喂养综合征',s:2}],
 model:'猫在饥饿状态下大量动员脂肪，肝脏合成载脂蛋白能力有限，甘油三酯堆积形成脂肪肝；肥胖猫风险最高。管理核心是尽早恢复进食、高蛋白、避免长时间禁食，并补充牛磺酸、精氨酸、钾与 B 族维生素。'},
{q:'猫为什么需要预成型维生素 A？如果只喂胡萝卜素含量高的植物性食物会怎样？',
 pts:[{t:'猫肠道缺乏 β-胡萝卜素-15,15′-双加氧酶，无法把 β-胡萝卜素转为视黄醇',s:4},
      {t:'植物性食物中的胡萝卜素利用率极低',s:2},
      {t:'后果：维生素 A 缺乏→夜盲、上皮角化、生长迟缓、繁殖障碍',s:2},
      {t:'对策：日粮使用预成型维生素 A（动物性来源或添加），并注意脂溶性维生素上限',s:2}],
 model:'猫缺乏将 β-胡萝卜素转化为视黄醇的双加氧酶，植物来源的胡萝卜素几乎不能被利用，因此必须由日粮提供预成型维生素 A；长期缺乏会导致夜盲、上皮角化与繁殖障碍。'}
],
cases: [
{title:'老年拉布拉多',stem:'朋友小张有一只 8 岁的拉布拉多犬，最近嗜睡、运动减少、反应变慢，BCS 7/9。经人推荐后购买了“老年犬粮”。\n\n请回答：\n（1）步入老年期，犬的身体机能会发生哪些变化？\n（2）请给出 3 条具体的饮食建议。',
 pts:[{t:'信息提取：年龄 8 岁（大型犬已属老年）、BCS 7/9 超重、活动下降',s:5},
      {t:'机能变化：基础代谢下降、肌肉量减少、消化吸收率下降、感官与认知功能减退、关节退化、肾功能储备下降',s:5},
      {t:'营养诊断：能量过剩（超重）+ 老年蛋白与关节支持需求',s:5},
      {t:'建议有依据：能量下调 10%–20%、优质易消化蛋白、ω-3/关节支持、限磷（若肾功能异常）、抗氧化',s:5},
      {t:'可执行：定量分餐、7 天过渡、每周称重与 BCS 复评',s:5},
      {t:'表达：先结论后展开、术语准确、有监测计划',s:5}],
 model:'8 岁拉布拉多已进入老年且超重。机能变化包括代谢下降、肌肉流失、消化吸收减弱、认知与感官减退、关节退化和肾功能储备下降。建议：①按目标体重下调能量 10%–20%，定量分餐；②选优质易消化蛋白（老年不应大幅限蛋白）；③补充 ω-3 与关节支持成分，若肾功能异常则限磷；④每周称重、BCS 复评，换粮 7 天过渡。'},
{title:'公猫排尿困难',stem:'6 岁公猫，排尿困难 2 天，超声见膀胱结石，尿 pH 7.2，镜检见鸟粪石结晶。\n\n请回答：\n（1）最可能的结石类型与依据；\n（2）三条饮食调整措施；\n（3）为什么不能对所有结石都盲目酸化尿液。',
 pts:[{t:'判断：鸟粪石（磷酸铵镁），依据碱性尿+结晶',s:5},
      {t:'风险因素：饮水少、肥胖、应激、尿路感染',s:5},
      {t:'措施：增加饮水（湿粮/流动水）、控制镁磷、监测下酸化、控制体重',s:5},
      {t:'必须排查并治疗感染（感染性鸟粪石）',s:5},
      {t:'反向风险：草酸钙结石需避免酸化，酸化反促形成',s:5},
      {t:'监测：复查尿 pH、影像、复发预防与饮水管理',s:5}],
 model:'碱性尿+鸟粪石结晶提示磷酸铵镁结石，常与饮水少、肥胖、应激及感染相关。措施：增加饮水（湿粮、流动水）、限制镁磷、在监测下酸化尿液、控制体重并治疗感染。但不能盲目酸化所有结石——草酸钙结石酸化反而促进形成，必须先确定类型。'},
{title:'CKD 猫',stem:'10 岁已绝育母猫，多饮多尿、体重下降 0.6 kg，肌酐与 SDMA 升高，血磷偏高，IRIS 2 期。\n\n请回答：\n（1）营养管理的核心目标是什么？\n（2）请给出日粮与监测方案。',
 pts:[{t:'核心：限磷延缓进展、维持体重与肌肉量、保证饮水',s:5},
      {t:'蛋白：适度限制（而非越低越好），选高消化率优质蛋白',s:5},
      {t:'其他：补钾、ω-3、控制钠、纠正代谢性酸中毒',s:5},
      {t:'方案可执行：肾病处方粮、湿粮增加饮水、少量多餐',s:5},
      {t:'监测：体重/BCS、肌酐与 SDMA、磷、钾、尿蛋白、血压、每 3 个月复评',s:5},
      {t:'沟通：解释“限磷不是绝食”，提高依从性',s:5}],
 model:'CKD 猫营养管理核心是限磷、维持体重与肌肉量、保证饮水。蛋白适度限制并选优质高消化率蛋白；补钾、ω-3、控制钠。用肾病处方粮+湿粮提高水分摄入，少量多餐；每 3 个月监测体重、肌酐、SDMA、磷、钾、尿蛋白与血压。'},
{title:'糖尿病犬的“无糖”零食',stem:'9 岁已绝育贵宾犬，BCS 7/9，糖尿病胰岛素治疗中。复诊时主人说：“打针后好了一阵，最近尿又多，主粮常剩。”追问发现：两餐之间喂冻干肉粒、洁牙棒、营养膏，还给少量“无糖”人类点心。主人说：“它生病后很可怜，爱吃就多给；无糖的应该不影响血糖。”\n\n请回答：\n（1）饲喂方式存在哪些问题？\n（2）请给出合理建议。',
 pts:[{t:'问题：餐间零食破坏血糖曲线，与胰岛素峰值不匹配',s:5},

const $ = (s)=>document.querySelector(s);

const rnd = (n)=>Math.floor(Math.random()*n);
const shuffle = (a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick = (a,n)=>shuffle(a).slice(0,n);
const fmt = (s)=>String(s).padStart(2,'0');
const LS = {
  get(k,d){try{const v=localStorage.getItem('rc_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('rc_'+k,JSON.stringify(v))}catch(e){}}
};

function recordWrong(q){
  if(!Array.isArray(state.wrong)) state.wrong=[];
  const key=String(q.q||'');
  state.wrong = state.wrong.filter(x=>String(x.q)!==key);
  state.wrong.push({...q, ts:Date.now()});
  state.wrong = state.wrong.slice(-300);
  LS.set('wrong', state.wrong);
  LS.set('wrong_bak', state.wrong);   /* 自动备份，防误清空/换文件 */
  toast('已加入错题本 · 共 '+state.wrong.length+' 题');
}
function toast(msg){
  let d=document.getElementById('rc-toast');
  if(!d){ d=document.createElement('div'); d.id='rc-toast'; document.body.appendChild(d); }
  d.textContent=msg; d.className='rc-toast show';
  clearTimeout(window.__rcToastTimer);
  window.__rcToastTimer=setTimeout(function(){ d.className='rc-toast'; }, 1600);
}
const state = {
  screen:'home',
  semi:{must:[],buzz:[],short:null,idx:0,phase:'',score:{must:0,buzz:0,short:0},buzzLocked:false,picked:null,answered:false},
  final:{cs:null,phase:'',rubric:[0,0,0,0,0,0]},
  practice:{list:[],idx:0,ok:0,done:0,show:false},
  wrong: (function(){ const v=LS.get('wrong',[]); return Array.isArray(v)?v:[]; })()
};

let timerId=null, deadline=0, remainMs=0;
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function startTimer(ms, onTick, onEnd){
  stopTimer(); deadline=Date.now()+ms; remainMs=ms;
  timerId=setInterval(()=>{
    remainMs = deadline-Date.now();
    if(remainMs<=0){ remainMs=0; stopTimer(); onTick&&onTick(0); onEnd&&onEnd(); return; }
    onTick&&onTick(remainMs);
  },100);
}

function nav(s){
  state.screen=s; render(); window.scrollTo(0,0);
  // 手机返回键：从任意页面回到首页，而不是直接退出网页
  if(s!=='home' && !window.__rcPushed){ try{ history.pushState({rc:1},''); window.__rcPushed=true; }catch(e){} }
}
window.addEventListener('popstate', function(){
  window.__rcPushed=false;
  if(state.screen!=='home'){ stopTimer(); state.screen='home'; render(); window.scrollTo(0,0); }
});

/* ---------- 半决赛 ---------- */
function startSemi(){ state.mode='semi';
  const singles = shuffle(DB.objective.filter(x=>x.t==='single')).slice(0,6);
  const judges = shuffle(DB.objective.filter(x=>x.t==='judge')).slice(0,4);
  const buzz = shuffle(DB.objective.filter(x=>x.t==='multi')).slice(0,4);
  state.semi={
    must: [...singles.map(x=>({...x,pts:4})), ...judges.map(x=>({...x,pts:3}))],
    buzz: buzz.map(x=>({...x,pts:6})),
    short: shuffle(DB.short)[0],
    idx:0, phase:'must', score:{must:0,buzz:0,short:0}, buzzLocked:false, picked:null, answered:false, log:[]
  };
  nav('semi');
}
function startFull(){ startSemi(); state.full=true; state.mode='full'; }

function renderSemi(){
  const m=state.semi;
  if(m.phase==='must') return renderMust(m);
  if(m.phase==='buzz') return renderBuzz(m);
  if(m.phase==='short') return renderShort(m);
  return renderSemiResult(m);
}

function stepbar(total, idx, logArr){
  let h='<div class="stepbar">';
  for(let i=0;i<total;i++){
    const r=logArr&&logArr[i];
    h+=`<i class="${i<idx?(r==='ok'?'ok':r==='bad'?'bad':'on'):''}"></i>`;
  }
  return h+'</div>';
}

function renderMust(m){
  const q=m.must[m.idx];
  const tSec=8;
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="badge red">半决赛 · 第一轮 必答</span>
      <span class="note">第 ${m.idx+1} / ${m.must.length} 题 · ${q.pts} 分</span>
    </div>
    ${stepbar(m.must.length, m.idx, m.log)}
    <div class="row" style="justify-content:space-between;align-items:center;margin:6px 0 4px">
      <span class="badge">${q.top}</span>
      <span class="timer hot" id="tm">${tSec}.0s</span>
    </div>
    <div class="bar"><i id="bar" style="width:100%"></i></div>
    <h2 style="margin-top:12px">${q.q}</h2>
    <div id="opts">${q.o.map(([k,t])=>`<div class="opt" data-k="${k}"><span class="k">${k}</span><span>${t}</span></div>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
}

function renderBuzz(m){
  const q=m.buzz[m.idx-m.must.length];
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="badge red">半决赛 · 第二轮 抢答</span>
      <span class="note">第 ${m.idx-m.must.length+1} / 4 题 · 6 分（答错 −2）</span>
    </div>
    ${stepbar(4, m.idx-m.must.length, m.log?m.log.slice(10):[])}
    <div class="row" style="justify-content:space-between;align-items:center;margin:6px 0 4px">
      <span class="badge">${q.top} · 多选</span>
      <span class="timer hot" id="tm">8.0s</span>
    </div>
    <div class="bar"><i id="bar" style="width:100%"></i></div>
    <h2 style="margin-top:12px">${q.q}</h2>
    <div id="opts">${q.o.map(([k,t])=>`<div class="opt" data-k="${k}"><span class="k">${k}</span><span>${t}</span></div>`).join('')}</div>
    <div class="row" style="margin-top:6px">
      <button class="btn grow" id="buzzBtn" onclick="doBuzz()">抢答！</button>
      <button class="btn ghost" onclick="skipBuzz()">放弃本题</button>
    </div>
    <div id="fb"></div>
  </div>`;
}

function renderShort(m){
  const q=m.short;
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="badge red">半决赛 · 第三轮 简答</span>
      <span class="note">10 分 · 60 秒</span>
    </div>

    <p class="note">限 5 句以内。写下你的答案要点（说不出来也可以直接点“开始自评”）。</p>
    <textarea id="ans" placeholder="在这里作答…"></textarea>
    <div class="row" style="margin-top:10px">

    <div id="fb"></div>

function renderSemiResult(m){
  const total=m.score.must+m.score.buzz+m.score.short;
  return `
  <div class="card center">
    <div class="medal">${total>=63?'🏅':total>=56?'🎖️':'📋'}</div>
    <h1 style="margin-top:8px">半决赛 ${total} / 70</h1>
    <p class="sub">必答 ${m.score.must}/36　·　抢答 ${m.score.buzz}/24　·　简答 ${m.score.short}/10</p>
    <p class="note">${total>=56?'稳进前 10 的分数。':total>=49?'接近晋级线，抢答与简答还能再捞分。':'需要重点补强，建议先刷题库。'}</p>
  </div>
  <div class="card">
    <h3>答题复盘</h3>
    ${m.review&&m.review.length?m.review.map(r=>`<p style="font-size:14px;margin:0 0 8px">${r}</p>`).join(''):'<p class="note">无</p>'}
  </div>
  <div class="row">
    ${state.full?`<button class="btn grow" onclick="startFinal(true)">进入总决赛 →</button>`:`<button class="btn grow" onclick="nav('home')">返回首页</button>`}
    <button class="btn ghost" onclick="nav('wrong')">错题本（${state.wrong.length}）</button>
    <button class="btn ghost" onclick="startSemi()">再来一次</button>
  </div>`;
}

/* ---------- 必答交互 ---------- */
function bindMust(){
  const m=state.semi; if(m.phase!=='must') return;
  const q=m.must[m.idx];
  startTimer(8000,(r)=>{const e=$('#tm'),b=$('#bar'); if(e)e.textContent=(r/1000).toFixed(1)+'s'; if(b)b.style.width=(r/8000*100)+'%';},()=>{
    if(state.semi.answered) return;
    state.semi.answered=true; finishMust(null);
  });
  document.querySelectorAll('#opts .opt').forEach(el=>{
    el.onclick=()=>{ if(state.semi.answered) return; state.semi.answered=true; finishMust(el.dataset.k); };
  });
}
function finishMust(k){
  stopTimer();
  const m=state.semi, q=m.must[m.idx];
  const ok = k===q.a;
  if(ok) m.score.must+=q.pts; else recordWrong(q);
  m.log=m.log||[]; m.log.push(ok?'ok':'bad');
  m.review=m.review||[];
  m.review.push(`<b>${ok?'✓':'✗'}</b> ${q.q.slice(0,34)}…　你的选择 <b>${k||'超时'}</b>，正确 <b>${q.a}</b>${q.ex?'　<span class="note">'+q.ex+'</span>':''}`);
  document.querySelectorAll('#opts .opt').forEach(el=>{
    el.onclick=null;
    if(el.dataset.k===q.a) el.classList.add('correct');
    else if(el.dataset.k===k) el.classList.add('wrong');
  });
  $('#fb').innerHTML=`<div class="reveal"><b>${ok?'答对 +'+q.pts:'答错 / 超时 +0'}</b>　正确答案：<b>${q.a}</b>${q.ex?'<br><span class="note">'+q.ex+'</span>':''}</div>
    <button class="btn block" style="margin-top:10px" onclick="nextMust()">下一题 →</button>`;
}
function nextMust(){
  const m=state.semi; m.idx++; m.answered=false;
  if(m.idx<m.must.length){ m.phase='must'; render(); }
  else { m.phase='buzz'; render(); }
}

/* ---------- 抢答交互 ---------- */
function bindBuzz(){
  const m=state.semi; if(m.phase!=='buzz') return;
  startTimer(8000,(r)=>{const e=$('#tm'),b=$('#bar'); if(e){e.textContent=(r/1000).toFixed(1)+'s'; if(r<3000)e.classList.add('hot');} if(b)b.style.width=(r/8000*100)+'%';},()=>{
    if(!m.buzzed){ m.buzzed=true; skipBuzz(true); }
  });
}
function doBuzz(){
  const m=state.semi; if(m.buzzed) return;
  m.buzzed=true; stopTimer();
  const q=m.buzz[m.idx - m.must.length];
  const btn=$('#buzzBtn');
  if(btn){ btn.disabled=false; btn.textContent='请选择答案…'; btn.onclick=()=>submitBuzz(); }
  const tm=$('#tm'); if(tm) tm.textContent='8.0s';
  startTimer(8000,(r)=>{const e=$('#tm'); if(e)e.textContent=(r/1000).toFixed(1)+'s';},()=>{ if(!m.answered){ m.answered=true; finishBuzz(null); } });
  document.querySelectorAll('#opts .opt').forEach(el=>{
    el.onclick=()=>{
      if(m.answered) return;
      el.classList.toggle('sel');
      const sel=Array.from(document.querySelectorAll('#opts .opt.sel')).map(e=>e.dataset.k).sort().join('');
      const b=$('#buzzBtn');
      if(b) b.textContent = sel ? ('提交答案（'+sel+'）') : '请选择答案…';
    };
  });
}

// 提前提交：选好即可交卷，不必等 8 秒
function submitBuzz(){
  const m=state.semi;
  if(m.answered || !m.buzzed) return;
  const sel=Array.from(document.querySelectorAll('#opts .opt.sel')).map(e=>e.dataset.k).sort().join('');
  if(!sel) return;                       // 没选就不提交，继续等计时
  m.answered=true; stopTimer();
  finishBuzz(sel);
}

function finishBuzz(ans){
  stopTimer();
  const m=state.semi, q=m.buzz[m.idx - m.must.length];
  const sel=ans==null?[]:ans.split('').sort().join('');
  const correct=q.a.split('').sort().join('');
  const ok = ans!=null && sel===correct;
  m.score.buzz += ok? 6 : (ans!=null? -2 : 0);
  if(ans!=null && !ok) recordWrong(q);
  m.review=m.review||[];
  m.review.push(`<b>${ok?'✓':ans!=null?'✗':'—'}</b> [抢答] ${q.q.slice(0,28)}…　你选 <b>${ans||'放弃'}</b>，正确 <b>${q.a}</b>${q.ex?'　<span class="note">'+q.ex+'</span>':''}`);
  document.querySelectorAll('#opts .opt').forEach(el=>{
    el.onclick=null;
    if(q.a.includes(el.dataset.k)) el.classList.add('correct');
    else if(ans&&ans.includes(el.dataset.k)) el.classList.add('wrong');
  });
  $('#fb').innerHTML=`<div class="reveal"><b>${ok?'抢答正确 +6':ans!=null?'答错 −2':'未作答 0'}</b>　正确答案：<b>${q.a}</b>${q.ex?'<br><span class="note">'+q.ex+'</span>':''}</div>
    <button class="btn block" style="margin-top:10px" onclick="nextBuzz()">下一题 →</button>`;
  const b=$('#buzzBtn'); if(b){b.disabled=true;}
}
function skipBuzz(auto){
  const m=state.semi; if(m.answered) return;
  if(!auto) m.buzzed=true;
  m.answered=true; stopTimer();
  const q=m.buzz[m.idx - m.must.length];
  m.review=m.review||[];
  m.review.push(`<b>—</b> [抢答] ${q.q.slice(0,28)}…　<b>放弃</b>（0），正确 <b>${q.a}</b>`);
  document.querySelectorAll('#opts .opt').forEach(el=>{el.onclick=null; if(q.a.includes(el.dataset.k)) el.classList.add('correct');});
  $('#fb').innerHTML=`<div class="reveal"><b>本题放弃（0 分）</b>　正确答案：<b>${q.a}</b>${q.ex?'<br><span class="note">'+q.ex+'</span>':''}</div>
    <button class="btn block" style="margin-top:10px" onclick="nextBuzz()">下一题 →</button>`;
}
function nextBuzz(){
  const m=state.semi; m.idx++; m.answered=false; m.buzzed=false;
  if(m.idx<10+4){ m.phase='buzz'; render(); }
  else { m.phase='short'; render(); }
}

/* ---------- 简答 ---------- */
function bindShort(){
  const m=state.semi; if(m.phase!=='short') return;
  startTimer(60000,(r)=>{const e=$('#tm'); if(e)e.textContent=Math.ceil(r/1000)+'s';},()=>{ submitShort(); });
}
function submitShort(){
  stopTimer();
  const m=state.semi, q=m.short;
  $('#fb').innerHTML=`
    <div class="hr"></div>
    <h3>评分要点（点选你说到的，按分值累计）</h3>
    ${q.pts.map((p,i)=>`<div class="chk" data-s="${p.s}" onclick="this.classList.toggle('on');calcShort()"><span class="n">${i+1}</span><span>${p.t}</span><span class="p">${p.s}分</span></div>`).join('')}
    <div class="reveal" style="margin-top:10px"><b>参考答案：</b>${q.model}</div>

    </div>`;
}
function calcShort(){
  const m=state.semi;

  m.score.short=s; $('#sscore').textContent=`得分 ${s} / 10`;
}
function doneShort(){ state.semi.phase='result'; render(); }

}
function finalAnswer(){ stopTimer(); state.final.phase='answer'; render(); }
function finalRubric(){ stopTimer(); state.final.phase='rubric'; render(); }
function calcRubric(){

}
function finishFinal(){

/* ---------- 总成绩 ---------- */
function renderResult(){
  const semi = state.semi.score.must+state.semi.score.buzz+state.semi.score.short;
  const fin = state.final.score||0;
  const onlyFinal = state.mode==='final';
  const total = onlyFinal ? (fin/30*100) : (semi/70*100*0.4 + fin/30*100*0.6);
  let award='未入围', ico='📋';
  if(total>=90){award='一等奖候选';ico='🥇';}
  else if(total>=80){award='二等奖候选';ico='🥈';}
  else if(total>=70){award='三等奖候选';ico='🥉';}
  else if(total>=60){award='优秀奖候选';ico='🎖️';}
  LS.set('plays',(LS.get('plays',0)||0)+1);
  if(!state._saved){ state._saved=true;
    const hist=LS.get('history',[]);
    hist.push({t:Date.now(), mode:state.mode, semi:semi, fin:fin, total:Number(total.toFixed(1))});
    LS.set('history', hist.slice(-20));
  }
  return `<div class="card center">
    <div class="medal">${ico}</div>
    <h1 style="margin:8px 0 4px">${total.toFixed(1)} 分</h1>

  </div>
  <div class="card">

      <tr><td><b>最终</b></td><td colspan="2"><b>${total.toFixed(1)} / 100</b>${onlyFinal?'（仅总决赛）':'（40% 半决赛 + 60% 总决赛）'}</td></tr>
    </table>
    <p class="note" style="margin-top:10px">同分时按初赛排名；真实赛场还需考虑对手水平与抽签。</p>

/* ---------- 题库练习 ---------- */
function startPractice(filter){
  const all=[...BANK,...DB.objective];
  let list=all;
  if(filter&&filter.wrongOnly){ syncWrong(); list=state.wrong.filter(q=>q.o&&q.a&&q.q); }
  else if(filter&&filter.type){ list=all.filter(q=>q.t===filter.type); }
  if(!list.length){ alert('没有可练的题目'); return; }
  state.practice={list:shuffle(list),idx:0,ok:0,done:0,show:false};
  nav('practice');
}
let practiceOrder=[];
function renderPractice(){
  const p=state.practice;
  if(p.idx>=p.list.length){
    return `<div class="card center"><h1>练习完成</h1><p class="sub">做了 ${p.done} 题，正确 ${p.ok} 题，正确率 ${p.done?(p.ok/p.done*100).toFixed(1):0}%</p>
      <div class="row" style="justify-content:center"><button class="btn" onclick="startPractice()">再来一轮</button><button class="btn ghost" onclick="nav('home')">返回</button></div></div>`;
  }
  const q=p.list[p.idx];
  const typeName={single:'单选题',multi:'多选题',judge:'判断题'}[q.t]||'题';
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="badge red">题库练习 · ${typeName}</span>
      <span class="note">${p.idx+1} / ${p.list.length} · 正确 ${p.ok}</span>
    </div>
    <h2 style="margin-top:10px">${q.q}</h2>
    <div id="opts">${q.o.map(([k,t])=>`<div class="opt" data-k="${k}"><span class="k">${k}</span><span>${t}</span></div>`).join('')}</div>
    ${q.t==='multi'?'<p class="note">多选题：可选多个，选完点“确认”。</p>':''}
    <div id="fb"></div>
    ${q.t==='multi'?'<button class="btn block" id="okBtn" onclick="practiceSubmit()">确认作答</button>':''}
  </div>`;
}
function bindPractice(){
  const p=state.practice;
  if(p.idx>=p.list.length) return;
  const q=p.list[p.idx];
  if(q.t==='multi'){
    document.querySelectorAll('#opts .opt').forEach(el=>el.onclick=()=>el.classList.toggle('sel'));
  } else {
    document.querySelectorAll('#opts .opt').forEach(el=>el.onclick=()=>{ if(p.show) return; practiceSubmit(el.dataset.k); });
  }
}
function practiceSubmit(pickOne){
  const p=state.practice, q=p.list[p.idx];
  if(p.show) return;
  let ans=pickOne;
  if(!ans){ ans=Array.from(document.querySelectorAll('#opts .opt.sel')).map(e=>e.dataset.k).join(''); }
  if(!ans) return;
  p.show=true; p.done++;
  const norm=s=>s.split('').sort().join('');
  const ok=norm(ans)===norm(q.a);
  if(ok) p.ok++; else recordWrong(q);
  document.querySelectorAll('#opts .opt').forEach(el=>{
    el.onclick=null;
    if(q.a.includes(el.dataset.k)) el.classList.add('correct');
    else if(ans.includes(el.dataset.k)) el.classList.add('wrong');
  });
  const fb=$('#fb'); if(fb) fb.innerHTML=`<div class="reveal"><b>${ok?'✓ 正确':'✗ 错误'}</b>　正确答案：<b>${q.a}</b>${q.ex?'<br><span class="note">'+q.ex+'</span>':''}</div>`;
  const btn=$('#okBtn'); if(btn) btn.remove();
  const c=document.createElement('button'); c.className='btn block'; c.style.marginTop='10px'; c.textContent='下一题 →';
  c.onclick=()=>{ p.idx++; p.show=false; render(); }; $('#app .card').appendChild(c);
}

/* ---------- 错题本备份与恢复 ---------- */
function exportWrong(){
  const data=JSON.stringify({v:1,ts:Date.now(),wrong:state.wrong});
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='错题本备份_'+new Date().toISOString().slice(0,10)+'_'+state.wrong.length+'题.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
  toast('已下载备份 · '+state.wrong.length+' 题');
}
function pickWrongFile(){ const f=document.getElementById('wrongFile'); if(!f) return; f.value=''; f.click(); }
function importWrong(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=function(){
    let arr=null;
    try{ const d=JSON.parse(r.result); arr=Array.isArray(d)?d:(d&&d.wrong); }catch(e){}
    if(!Array.isArray(arr)||!arr.length){ alert('这个文件里没有可用的错题数据'); return; }
    const have={}; state.wrong.forEach(function(x){ have[String(x.q)]=1; });
    let add=0;
    arr.forEach(function(q){ if(q&&q.q&&!have[String(q.q)]){ state.wrong.push(q); have[String(q.q)]=1; add++; } });
    state.wrong=state.wrong.slice(-300);
    LS.set('wrong',state.wrong); LS.set('wrong_bak',state.wrong);
    alert('已导入 '+add+' 道新错题，当前共 '+state.wrong.length+' 题');
    render();
  };
  r.readAsText(file,'utf-8');
}
function restoreWrongBak(){
  const bak=LS.get('wrong_bak',[]);
  if(!Array.isArray(bak)||!bak.length){ alert('没有找到自动备份'); return; }
  if(!confirm('用自动备份覆盖当前错题本？\n备份共 '+bak.length+' 题')) return;
  state.wrong=bak.slice(-300);
  LS.set('wrong',state.wrong);
  render();
  toast('已从自动备份恢复 '+state.wrong.length+' 题');
}
function clearWrong(){
  if(!confirm('清空错题本？（自动备份会保留，可恢复）')) return;
  state.wrong=[]; LS.set('wrong',[]);
  render();
  toast('已清空错题本');
}

/* 错题本里的题是当时的快照；题库答案若被修正过，打开错题本时按最新题库刷新一遍 */
function syncWrong(){
  const map={}; [...BANK,...DB.objective].forEach(x=>{ map[x.q]=x; });
  let changed=false;
  state.wrong=(state.wrong||[]).map(w=>{
    const f=map[w.q];
    if(!f) return w;
    if(f.a!==w.a||JSON.stringify(f.o)!==JSON.stringify(w.o)){ changed=true; return Object.assign({},f,{ts:w.ts||Date.now()}); }
    return w;
  });
  if(changed){ LS.set('wrong',state.wrong); LS.set('wrong_bak',state.wrong); }
  return changed;
}
function renderWrong(){
  syncWrong();
  const w=state.wrong.slice().reverse();
  return `<div class="card">

  <button class="btn block" onclick="nav('home')">返回首页</button>`;

/* ---------- 路由 ---------- */
function render(){
  stopTimer();
  const s=state.screen;
  let html='';
  if(s==='home') html=renderHome();
  else if(s==='semi'){ html=renderSemi(); }
  else if(s==='final') html=renderFinal();
  else if(s==='result') html=renderResult();
  else if(s==='practice') html=renderPractice();
  else if(s==='wrong') html=renderWrong();
  else if(s==='about') html=renderAbout();
  app.innerHTML=html;
  if(s==='semi'){
    if(state.semi.phase==='must') bindMust();
    else if(state.semi.phase==='buzz') bindBuzz();
    else if(state.semi.phase==='short') bindShort();
  }
  if(s==='final') bindFinal();
  if(s==='practice') bindPractice();
  document.querySelectorAll('.opt').forEach(el=>{ if(!el.onclick && state.screen!=='practice') {} });
}

// 键盘快捷键：1-4 / A-D 选项，Enter 下一步
document.addEventListener('keydown', function(e){
  const t=e.target;
  if(t && (t.tagName==='TEXTAREA' || t.tagName==='INPUT')) return;
  const k=(e.key||'').toLowerCase();
  const opts=document.querySelectorAll('#opts .opt');
  const pickIdx = /^[1-4]$/.test(k) ? Number(k)-1 : ('abcd'.indexOf(k));
  if(pickIdx>=0 && opts[pickIdx]){
    const target=opts[pickIdx];
    if(state.screen==='practice' || (state.screen==='semi' && state.semi.phase==='must')){
      target.click(); e.preventDefault(); return;
    }
    if(state.screen==='semi' && state.semi.phase==='buzz' && state.semi.buzzed && !state.semi.answered){
      target.click(); e.preventDefault(); return;
    }
  }
  if(k==='enter'){
    const b=document.querySelector('.btn.block:not([disabled])');
    if(b){ b.click(); e.preventDefault(); }
  }
});

// 判断题统一为 A=正确 / B=错误（兼容早期 T/F 与后期 A/B 两种写法）
function normalizeJudge(list){
  (list||[]).forEach(function(q){
    if(q.t!=='judge') return;
    var a=String(q.a), o=q.o||[], truth;
    if(a==='T'||a==='正确') truth=true;
    else if(a==='F'||a==='错误') truth=false;
    else { var i=(a==='A')?0:1; truth=!!(o[i]&&o[i][1]==='正确'); }
    q.o=[['A','正确'],['B','错误']];
    q.a=truth?'A':'B';
  });
}

/* 首次打开时自动导入从旧地址导出的错题（只做一次，按题干去重，答案以当前题库为准） */
(function(){
  try{
    if(localStorage.getItem('rc_migrated')==='1') return;
    fetch('migrate.json',{cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(arr){
        if(!Array.isArray(arr)||!arr.length){ localStorage.setItem('rc_migrated','1'); return; }
        var have={}; state.wrong.forEach(function(x){ have[x.q]=1; });
        var add=0;
        arr.forEach(function(q){
          if(q&&q.q&&!have[q.q]){ state.wrong.push(Object.assign({},q,{ts:q.ts||Date.now()})); have[q.q]=1; add++; }
        });
        state.wrong=state.wrong.slice(-300);
        LS.set('wrong',state.wrong); LS.set('wrong_bak',state.wrong);
        localStorage.setItem('rc_migrated','1');
        if(add){
          if(state.screen==='home'||state.screen==='wrong') render();
          toast('已从旧地址导入 '+add+' 道错题');
        }
      })
      .catch(function(){});
  }catch(e){}
})();
